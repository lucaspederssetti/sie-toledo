<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIE - Toledo · Minha matrícula</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{ --brand:#2f7f47; --border:#e2e5e9; }
    body{ background:#ffffff; }
    .navbar{ background:var(--brand); }
    .page-wrap{ max-width:1200px; margin-inline:auto; }
    .welcome-row{ display:flex; align-items:center; gap:.5rem; margin:.75rem 0 .5rem; }
    .welcome-avatar{ width:28px; height:28px; border-radius:50%; background:#e9ecef; color:#adb5bd; display:inline-flex; align-items:center; justify-content:center; }
    .welcome-title{ font-weight:600; margin:0; }

    .card{ border:1px solid var(--border); border-radius:.5rem; }
    .card-header{ background:#f8f9fa; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .list-group-item{ border-color:var(--border); padding:.625rem .75rem; }
    .icon{ width:22px; display:inline-flex; justify-content:center; color:#6c757d; }
    .badge-green{ background:#e7f5ea; color:#146c43; font-weight:600; }
    .map-link{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:.375rem; border:1px solid #dfe3e7; color:#6c757d; text-decoration:none; }
    .map-link:hover{ background:#f3f4f6; color:#343a40; }

    @media (min-width:992px){ .page-wrap{ max-width:720px; } }
  </style>
</head>
<body>

 
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-xxl">
      <a class="navbar-brand" href="#">SIE - Toledo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav"
              aria-controls="topnav" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="topnav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="esporte_filtrado.html">Pesquisar esporte</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="usuario_com_vaga.html">Minhas matrículas</a></li>
          <li class="nav-item"><a class="nav-link" href="meu_perfil.html">Meu perfil</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <main class="container-xxl page-wrap py-2">

    <div class="welcome-row">
      <span class="welcome-avatar"><i class="bi bi-person"></i></span>
      <h6 class="welcome-title">Bem vindo, Nome</h6>
    </div>

    <p class="mb-3 fw-semibold">Suas matrículas</p>

    
    <div class="card">
      <div class="card-header">
        <strong>Futebol</strong>
        <span class="badge bg-success-subtle text-success fw-semibold">Matriculado</span>
      </div>

      <ul class="list-group list-group-flush">
        <li class="list-group-item">
          <span class="icon"><i class="bi bi-calendar2-day"></i></span>
          Segunda-Feira e Quarta-Feira
        </li>
        <li class="list-group-item">
          <span class="icon"><i class="bi bi-clock"></i></span>
          19:00
        </li>
        <li class="list-group-item d-flex align-items-center justify-content-between">
          <span><span class="icon"><i class="bi bi-geo-alt"></i></span>C. Esportivo Vaquinha</span>
          <a class="map-link" target="_blank"
             href="https://www.google.com/maps/search/?api=1&query=C.+Esportivo+Vaquinha"
             aria-label="Abrir no Google Maps"><i class="bi bi-box-arrow-up-right"></i></a>
        </li>
        <li class="list-group-item">
          <span class="icon"><i class="bi bi-person-badge"></i></span>
          Prof. Ederson
        </li>

       
        <li class="list-group-item d-flex align-items-center">
          <span class="icon"><i class="bi bi-info-circle"></i></span>
          <span>Faltas consecutivas</span>
          <span class="badge rounded-pill badge-green ms-2">1/3</span>
        </li>
        <li class="list-group-item d-flex align-items-center">
          <span class="icon"><i class="bi bi-info-circle"></i></span>
          <span>Faltas no total</span>
          <span class="badge rounded-pill badge-green ms-2">1/5</span>
        </li>
      </ul>

      <div class="card-footer text-end">
        <a href="#" class="btn btn-danger btn-sm">Desistir da vaga</a>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
