<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIE - Toledo · Esporte filtrado</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root{ --brand:#2f7f47; --border:#e2e5e9; }
    body{ background:#fff; }
    .navbar{ background:var(--brand); }

    .page-wrap{ max-width:1200px; margin-inline:auto; }
    @media (min-width:992px){ .page-wrap{ max-width:720px; } }

    .welcome-row{ display:flex; align-items:center; gap:.5rem; margin:.75rem 0 .5rem; }
    .welcome-avatar{ width:28px; height:28px; border-radius:50%; background:#e9ecef; color:#adb5bd; display:inline-flex; align-items:center; justify-content:center; }
    .welcome-title{ margin:0; font-weight:600; }

    .filter-link{ color:#6c757d; text-decoration:none; font-weight:600; display:inline-flex; gap:.25rem; align-items:center; }

    .tag{ background:#f1f3f5; border:1px solid #e0e3e7; border-radius:999px; padding:.3rem .6rem; display:inline-flex; align-items:center; gap:.45rem; font-size:.875rem; }
    .tag .btn-close{ width:.6rem; height:.6rem; opacity:.6; }
    .tag .btn-close:hover{ opacity:1; }

    .card{ border:1px solid var(--border); border-radius:.5rem; }
    .card-header{ background:#f8f9fa; border-bottom:1px solid var(--border); font-weight:500; }
    .list-group-item{ border-color:var(--border); padding:.625rem .75rem; }
    .icon{ width:22px; display:inline-flex; justify-content:center; color:#6c757d; }
    .badge-green{ background:#e7f5ea; color:#146c43; font-weight:600; }
    .badge-gray{ background:#f1f2f4; color:#6c757d; border:1px solid #e0e3e7; font-weight:600; }

    .map-link{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:.375rem; border:1px solid #dfe3e7; color:#6c757d; text-decoration:none; }
    .map-link:hover{ background:#f3f4f6; color:#343a40; }

    .form-check-input:checked{ background-color:#198754; border-color:#198754; }
    .form-check-input:focus{ border-color:#198754; box-shadow:0 0 0 .25rem rgba(25,135,84,.25); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-xxl">
      <a class="navbar-brand" href="#">SIE - Toledo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav"><span class="navbar-toggler-icon"></span></button>
      <div id="topnav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="esporte_filtrado.html">Pesquisar esporte</a></li>
          <li class="nav-item"><a class="nav-link" href="usuario_com_vaga.html">Minhas matrículas</a></li>
          <li class="nav-item"><a class="nav-link" href="meu_perfil.html">Meu perfil</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-xxl page-wrap py-2">
    <div class="welcome-row">
      <span class="welcome-avatar"><i class="bi bi-person"></i></span>
      <h6 class="welcome-title">Bem vindo, Nome</h6>
    </div>

    
    <div class="input-group mb-2">
      <input id="qInput" type="search" class="form-control" placeholder="Procure por um esporte">
      <button id="btnBuscar" class="btn btn-success" type="button" aria-label="Buscar"><i class="bi bi-search"></i></button>
    </div>

    <div class="mb-2 d-flex align-items-center justify-content-between">
    
      <button type="button" class="btn btn-link p-0 filter-link" data-bs-toggle="modal" data-bs-target="#filtrosModal">
        Filtros <i class="bi bi-sliders"></i>
      </button>
    </div>
    <div id="tags" class="d-flex flex-wrap gap-2 mb-3"></div>

    <div id="cards" class="vstack gap-4"></div>
  </main>

  
  <div class="modal fade" id="filtrosModal" tabindex="-1" aria-labelledby="filtrosModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header">
          <h5 class="modal-title" id="filtrosModalLabel">Filtros</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <form id="formFiltros">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Esporte</label>
              <select class="form-select" name="esportes">
                <option value="Todos" selected>Todos</option>
                <option value="Futebol">Futebol</option>
               
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Local do treino</label>
              <select class="form-select" name="local">
                <option value="Todos" selected>Todos</option>
                <option>Estádio 14 de Dezembro</option>
                <option>C. Esportivo Vaquinha</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Dias da semana</label>
              <select class="form-select" name="dias">
                <option value="Todos" selected>Todos</option>
                <option value="2e4">2ª e 4ª</option>
                <option value="3e5">3ª e 5ª</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Horários</label>
              <select class="form-select" name="horarios">
                <option value="Todos" selected>Todos</option>
                <option>18:00</option>
                <option>19:00</option>
                <option>20:00</option>
                <option>21:00</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Professor</label>
              <select class="form-select" name="professores">
                <option value="Todos" selected>Todos</option>
                <option>Prof. Ederson</option>
                <option>Prof. Leandro</option>
              </select>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="ckCheias" name="status" value="cheias" checked>
              <label class="form-check-label" for="ckCheias">Mostrar turmas cheias</label>
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <div></div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success">Aplicar filtros</button>
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    
    const DADOS = [
      { esporte:'Futebol', dias:'2e4', horario:'19:00', local:'Estádio 14 de Dezembro', professor:'Prof. Ederson',  status:'vagas',  vagas:'30/40' },
      { esporte:'Futebol', dias:'2e4', horario:'21:00', local:'Estádio 14 de Dezembro', professor:'Prof. Ederson',  status:'vagas',  vagas:'30/40' },
      { esporte:'Futebol', dias:'2e4', horario:'20:00', local:'C. Esportivo Vaquinha',  professor:'Prof. Leandro', status:'cheias', fila_espera:5 }
    ];

   
    const filtros = {
      esporte:   null,
      local:     null,
      dias:      null,
      horario:   null,
      professor: null,
      status:    'cheias' 
    };

  
    const qs = new URLSearchParams(location.search);
    const q  = (qs.get('q')||'').trim().toLowerCase();
    function norm(v){ return (v && v !== 'Todos') ? v : null; }

    filtros.esporte   = norm(qs.get('esporte'));
    filtros.dias      = norm(qs.get('dias'));
    filtros.horario   = norm(qs.get('horario'));
    filtros.local     = norm(qs.get('local'));
    filtros.professor = norm(qs.get('professor'));
    if (qs.has('status')) filtros.status = qs.get('status'); 

    if (q) {
      if (/^\d{1,2}:\d{2}$/.test(q)) filtros.horario = q;
      else if (q.includes('futebol')) filtros.esporte = 'Futebol';
      document.getElementById('qInput').value = q;
    }

  
    const ROTULOS = {
      esporte:   v=> v,
      local:     v=> v,
      dias:      v=> v==='2e4' ? '2ª e 4ª' : (v==='3e5' ? '3ª e 5ª' : v),
      horario:   v=> v,
      professor: v=> v,
      status:    v=> v==='cheias' ? 'Vagas cheias' : v
    };

    const tagsEl  = document.getElementById('tags');
    const cardsEl = document.getElementById('cards');
    const qInput  = document.getElementById('qInput');

    function renderTags(){
      tagsEl.innerHTML = '';
      for (const [k,v] of Object.entries(filtros)) {
        if (!v) continue;
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerHTML = `${ROTULOS[k](v)} <button type="button" class="btn-close" aria-label="Remover"></button>`;
        span.querySelector('.btn-close').addEventListener('click', ()=>{
          filtros[k] = null;
          renderTags(); renderCards();
        });
        tagsEl.appendChild(span);
      }
    }

    function combina(item){
      if (filtros.esporte   && item.esporte   !== filtros.esporte)   return false;
      if (filtros.local     && item.local     !== filtros.local)     return false;
      if (filtros.dias      && item.dias      !== filtros.dias)      return false;
      if (filtros.horario   && item.horario   !== filtros.horario)   return false;
      if (filtros.professor && item.professor !== filtros.professor) return false;
      if (!filtros.status && item.status === 'cheias') return false;
      return true;
    }

    function linhaDias(dias){
      return dias === '2e4' ? 'Segunda-Feira e Quarta-Feira' : 'Terça-Feira e Quinta-Feira';
    }

    function cardHTML(item){
      const cheio = item.status === 'cheias';
      return `
        <div class="card">
          <div class="card-header">${item.esporte}</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item"><span class="icon"><i class="bi bi-calendar2-day"></i></span> ${linhaDias(item.dias)}</li>
            <li class="list-group-item"><span class="icon"><i class="bi bi-clock"></i></span> ${item.horario}</li>
            <li class="list-group-item d-flex align-items-center justify-content-between">
              <span><span class="icon"><i class="bi bi-geo-alt"></i></span> ${item.local}</span>
              <a class="map-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.local)}" aria-label="Abrir no Google Maps"><i class="bi bi-box-arrow-up-right"></i></a>
            </li>
            <li class="list-group-item"><span class="icon"><i class="bi bi-person-badge"></i></span> ${item.professor}</li>
            <li class="list-group-item d-flex align-items-center justify-content-between">
              <span>
                <span class="icon"><i class="bi bi-info-circle"></i></span>
                ${cheio ? 'Vagas cheias' : 'Vagas'}
                ${cheio
                  ? `<span class="badge rounded-pill badge-gray ms-2">Lista de espera: ${item.fila_espera}</span>`
                  : `<span class="badge rounded-pill badge-green ms-2">${item.vagas}</span>`}
              </span>
              ${cheio
                ? `<a href="#" class="btn btn-success btn-sm btn-wait">Lista de espera</a>`
                : `<a href="usuario_com_vaga.html" class="btn btn-success btn-sm">Inscrever-se</a>`}
            </li>
          </ul>
        </div>`;
    }

    function renderCards(){
      const itens = DADOS.filter(combina);
      cardsEl.innerHTML = itens.map(cardHTML).join('') || `<div class="text-muted">Nenhuma turma encontrada com os filtros selecionados.</div>`;
      document.querySelectorAll('.btn-wait').forEach(btn=>{
        btn.addEventListener('click', e=>{
          e.preventDefault();
          location.href = 'usuario_lista_espera.html';
        });
      });
    }

    document.getElementById('formFiltros').addEventListener('submit', function (e) {
      e.preventDefault();
      const esporteSel   = this.elements['esportes']?.value   || '';
      const localSel     = this.elements['local']?.value      || '';
      const diasSel      = this.elements['dias']?.value       || '';
      const horarioSel   = this.elements['horarios']?.value   || '';
      const professorSel = this.elements['professores']?.value|| '';
      const statusOn     = !!this.elements['status']?.checked;

      filtros.esporte   = (esporteSel   && esporteSel   !== 'Todos') ? esporteSel   : null;
      filtros.local     = (localSel     && localSel     !== 'Todos') ? localSel     : null;
      filtros.dias      = (diasSel      && diasSel      !== 'Todos') ? diasSel      : null;
      filtros.horario   = (horarioSel   && horarioSel   !== 'Todos') ? horarioSel   : null;
      filtros.professor = (professorSel && professorSel !== 'Todos') ? professorSel : null;
      filtros.status    = statusOn ? 'cheias' : null;

      bootstrap.Modal.getInstance(document.getElementById('filtrosModal'))?.hide();
      renderTags(); renderCards();
    });

    
    document.getElementById('btnBuscar').addEventListener('click', ()=>{
      const v = (qInput.value||'').trim().toLowerCase();
   
      filtros.esporte = filtros.local = filtros.dias = filtros.horario = filtros.professor = null;
      filtros.status = 'cheias';
      filtros.esporte = 'Futebol';
      renderTags(); renderCards();
    });

 function syncModalFromFilters() {
  const form = document.getElementById('formFiltros');


  const setSel = (name, value) => {
    const sel = form.elements[name];
    if (!sel) return;
    const alvo = value ?? 'Todos';
    
    const opt = [...sel.options].find(o => (o.value || o.text) === alvo);
    if (opt) sel.value = opt.value || opt.text; else sel.value = 'Todos';
  };

  setSel('esportes',   filtros.esporte);
  setSel('local',      filtros.local);
  setSel('dias',       filtros.dias);
  setSel('horarios',   filtros.horario);
  setSel('professores',filtros.professor);

 
  const ck = form.elements['status'];
  if (ck) ck.checked = (filtros.status === 'cheias');
}


document.getElementById('filtrosModal')
  .addEventListener('show.bs.modal', syncModalFromFilters);
    renderTags(); renderCards();
  </script>
</body>
</html>
